services:
  video-model-init:
    image: virtual-tryon-video:local
    build: {context: ., dockerfile: worker/video.Dockerfile}
    command: ["python", "scripts/download-video-models.py"]
    environment:
      HF_HOME: /models/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    volumes: ["./models:/models"]
    restart: 'no'

  worker-gpu7:
    image: virtual-tryon-video:local
    build: {context: ., dockerfile: worker/video.Dockerfile}
    environment:
      MODEL_NAME: catv2ton
      WORKER_KIND: video
    stop_grace_period: 1900s
    healthcheck:
      start_period: 20m
    depends_on:
      video-model-init: {condition: service_completed_successfully}
